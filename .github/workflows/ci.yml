name: ci
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          files=$(git ls-files '*.mjs' '*.js' || true)
          if [ -z "$files" ]; then echo "no code yet"; exit 0; fi
          for f in $files; do node --check "$f"; done